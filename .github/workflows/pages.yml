# Build the Vonod marketing site and publish it to GitHub Pages.
#
# Pages source for this repo is "GitHub Actions" (not a branch), so the built
# dist/ is uploaded as an artifact and deployed straight from here — no
# gh-pages branch to keep in sync.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Where the landing page's CTAs ("Sign in", "Start building") send visitors.
# This is the *app*, not this site. Change it here when the app moves.
env:
  VITE_APP_URL: https://vonod-frontend.fly.dev

# Least privilege: read the repo, write a Pages deployment, mint the OIDC
# token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede a queued one but
# don't cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build
        env:
          VITE_APP_URL: ${{ env.VITE_APP_URL }}

      # Pages serves static files: a deep link like /features would 404 on
      # reload without this. The site is a single page today, but the copy
      # costs nothing and stops the class of bug before it appears.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
