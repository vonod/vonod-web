<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_blanco_vonod.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <!-- Title, description and the OG pair say the SAME thing on purpose: the
         page had three different pitches across these tags. 52 chars, so it
         survives the ~60-char SERP cut. See MESSAGING.md §6 for why the title
         leads with "AI calling" (what buyers search) while the H1 carries the
         broader orchestration positioning (what the company is). -->
    <title>Vonod — AI calling campaigns at scale, zero AI markup</title>
    <!-- The billing wedge is the second clause, not the last: snippets are cut
         around 155 chars and it is the one claim competitors cannot copy. -->
    <meta name="description" content="Outbound AI calling campaigns at scale. You pay for the orchestration — never a markup on the AI. Bring your own OpenAI, Deepgram and Twilio keys." />
    <link rel="canonical" href="https://vonod.github.io/vonod-web/" />

    <!-- Open Graph / social -->
    <meta property="og:title" content="Vonod — AI calling campaigns at scale, zero AI markup" />
    <meta property="og:description" content="Outbound AI calling campaigns at scale. You pay for the orchestration — never a markup on the AI. Bring your own OpenAI, Deepgram and Twilio keys." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vonod.github.io/vonod-web/" />
    <meta property="og:site_name" content="Vonod" />
    <meta property="og:locale" content="en" />
    <!-- `summary`, not `summary_large_image`: there is no 1200x630 card yet, and
         the only images here are transparent logos, which most clients composite
         onto white — the white wordmark would vanish. MESSAGING.md §6 tracks it. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vonod — AI calling campaigns at scale, zero AI markup" />
    <meta name="twitter:description" content="Outbound AI calling campaigns at scale. You pay for the orchestration — never a markup on the AI. Bring your own OpenAI, Deepgram and Twilio keys." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />

    <!-- Dark by design: the brand system documents no light palette, so there
         is no theme to detect and no flash to guard against. -->
    <style>
      html { background-color: #0f0f0f; color-scheme: dark; }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
